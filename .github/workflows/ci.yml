name: Kandy Ads CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kandyads_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/kandyads_test
          JWT_SECRET: ci-test-secret-key-at-least-16
      - run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/kandyads_test
          JWT_SECRET: ci-test-secret-key-at-least-16
      - run: npx prisma db execute --file prisma/migrations/20260902143000_employee_skills_roles/migration.sql
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/kandyads_test
          JWT_SECRET: ci-test-secret-key-at-least-16
      - run: npx prisma db execute --file prisma/migrations/20260902160000_company_settings/migration.sql
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/kandyads_test
          JWT_SECRET: ci-test-secret-key-at-least-16
      - run: npx prisma db execute --file prisma/migrations/20260902163000_branches_number_sequences/migration.sql
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/kandyads_test
          JWT_SECRET: ci-test-secret-key-at-leaf? 
