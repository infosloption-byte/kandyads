# HTTP-only pre-DNS deployment. After DNS resolves, use Certbot to add HTTPS.
# This file adds independent virtual hosts and does not replace other applications.
server {
    listen 80;
    server_name kandyads.lk www.kandyads.lk;
    location / {
        proxy_pass http://127.0.0.1:9030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name admin.kandyads.lk;
    location / {
        proxy_pass http://127.0.0.1:9031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name api.kandyads.lk;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:9032;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
